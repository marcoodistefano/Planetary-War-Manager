services:
  scope:
    image: weaveworks/scope:latest
    network_mode: "host"
    pid: "host"
    privileged: true
    labels:
      - "works.weave.role=system"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
    command:
      - "--probe.docker=true"

  # REDIS PER IL COMM-LINK (MESSAGGI IN TEMPO REALE, PUB/SUB, CACHE RISORSE, SESSIONI, ETC.)
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data  # Nominato: evita volumi anonimi ad ogni avvio
    networks:
      - pwm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
# IL DATABASE POSTGRESQL
  db:
    image: postgres:15-alpine
    container_name: pwm-postgres
    restart: always  # Forza il riavvio se il database crasha
    environment:
      - POSTGRES_USER=commander_admin        # È meglio definire un utente specifico
      - POSTGRES_DB=pwm_tactical_database
      - POSTGRES_PASSWORD=secret
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d  # Per gli script SQL iniziali
      - postgres_data:/var/lib/postgresql/data # <--- FONDAMENTALE per non perdere i dati
    ports:
      - "5432:5432" # Ti permette di collegarti con programmi esterni dal tuo PC
    networks:
      - pwm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander_admin -d pwm_tactical_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FRONTEND IN DEV MODE (CON HOT-RELOAD)
  frontend-dev:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8100:8100"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./shared/assets:/app/src/assets
    networks:
      - pwm-net

  # User service (gestione utenti, autenticazione, profili, ecc.)
  user-service:
    build: ./services/user-service
    working_dir: /app/services/user-service
    ports:
      - "3000:3000"
    volumes:
      - ./services/user-service:/app/services/user-service
      - ./services/shared:/app/services/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://commander_admin:secret@db:5432/pwm_tactical_database
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8100}
    networks:
      - pwm-net

  # CLOUDFLARE TUNNEL (Alternativa a Ngrok)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://frontend-dev:8100
    networks:
      - pwm-net
    depends_on:
      - frontend-dev

  # APP ROUTE (API router)
  app-route:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile.app-route
    # Impostiamo la directory di lavoro alla radice per far coincidere i percorsi require
    working_dir: /app
    volumes:
      - ./gateway:/app 
      - app_route_node_modules:/app/node_modules
      - ./services/user-service:/app/services/user-service
      - ./services/match:/app/services/match
      - ./services/shared:/app/services/shared
    ports:
      - "4000:3001" # <--- Frontend -> app-route (porta interna 3001)
    depends_on:
      - user-service
    environment:
      - REDIS_URL=redis://redis:6379 # <--- FONDAMENTALE per il Comm-Link
      - JWT_SECRET=${SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CHAT_SERVICE_URL=http://chat:3001
      - DB_URL=postgres://commander_admin:secret@db:5432/pwm_tactical_database
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8100}
    networks:
      - pwm-net
  match-service:
    build: ./services/match
    working_dir: /app/services/match
    ports:
      - "3004:3004" # <--- app-route -> match-service (porta interna 3004)
    volumes:
      - ./services/match:/app/services/match
      - ./services/shared:/app/services/shared
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://commander_admin:secret@db:5432/pwm_tactical_database
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - pwm-net
  # ENGINE RISORSE
  engine-res:
    build: ./services/resources
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_USER=commander_admin
      - DB_PASSWORD=secret
      - DB_NAME=pwm_tactical_database
      - DB_PORT=5432
    networks:
      - pwm-net

  # CACHE WARMUP (BOOTSTRAP REDIS)
  cache-warmup:
    build: ./services/cache-warmup
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      match-service:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://commander_admin:secret@db:5432/pwm_tactical_database
      - MATCH_SERVICE_URL=http://match-service:3004
    volumes:
      - ./shared/assets:/app/assets:ro
    restart: unless-stopped
    networks:
      - pwm-net

  # CHAT
  chat:
    build: ./services/chat
    working_dir: /app/services/chat
    volumes:
      - ./services/chat:/app/services/chat
      - ./services/shared:/app/services/shared
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://commander_admin:secret@db:5432/pwm_tactical_database
      - JWT_SECRET=${SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - pwm-net

  # GATEWAY DI INGRESSO
  gateway:
    image: nginx:alpine
    ports:
      - "80:80" #modificherei questa porta, è la nota di HTTP ma in websocket non usiamo questa porta.
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/www:/usr/share/nginx/html
      - ./shared/assets:/usr/share/nginx/html/assets:ro 
    depends_on:
      - app-route
      - user-service
      - engine-res
      - chat
    networks:
      - pwm-net

  # --- RIPRISTINA ASSETS ---
  ripristina:
    build:
      context: .
      dockerfile: ./services/ripristina/Dockerfile
    volumes:
      - ./shared/assets:/app/assets
    networks:
      - pwm-net

  # --- AMMINISTRATORE ---
  amministratore:
    build: ./services/amministratore
    ports:
      - "8080:8080" # Pannello admin (es. http://localhost:8080)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Necessario per controllare gli altri container
      - .:/project:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROJECT_ROOT=/project
    depends_on:
      - ripristina
    networks:
      - pwm-net

  # --- STRUMENTI DI VISUALIZZAZIONE DATABASE ---
  pgadminer:
    image: adminer
    container_name: pwm-adminer
    ports:
      - "8085:8080" # Porta non canonica esterna per visualizzare Postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pwm-net
      
  redis-ui:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8086:8081" # Porta non canonica esterna per visualizzare Redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pwm-net

volumes:
  postgres_data:
  redis_data:              # Dati persistenti Redis (cache, sessioni, pub/sub state)
  app_route_node_modules:
  frontend_node_modules:

networks:
  pwm-net:
    driver: bridge
