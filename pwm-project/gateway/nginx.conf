events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream app_route {
    server app-route:3001;
  }

  server {
    listen 80;

    location = /wpad.dat {
        access_log off;
        log_not_found off;
        return 404;
    }
    
    location /auth/ {
      proxy_pass http://app_route;
    }

    location /player/ {
      proxy_pass http://app_route;
    }

    # Proxy per API frontend che usano prefisso /api/ — riscrive /api/... -> /...
    location /api/ {
      proxy_pass http://app_route/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /home/ {
      proxy_pass http://app_route;
    }

    location /match {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /chat {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /assets/2Dmodels/ {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /assets/map/ {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /assets/profile_icons/ {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /assets/game_rules.json {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /assets/ETOPO_2022_v1_60s_N90W180_surface.tif {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /assets/lc_mcd12q1v061.t1_c_500m_s_20210101_20211231_go_epsg.4326_v20230818.tif {
      proxy_pass http://app_route;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }


    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    # Gestione asset condivisi (TIFF, CDB, Modelli)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Access-Control-Allow-Origin *; # Permette al JS di leggere i file
    }
    
  }
}
