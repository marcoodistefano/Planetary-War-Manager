<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>PWM - Test Registrazione</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #1a1a1a; color: white; }
        form { background: #2a2a2a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #response { margin-top: 20px; font-size: 0.8em; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

<form id="authForm">
    <h3>PWM Auth Test - Registrazione</h3>
    <div>
        <label>Username</label>
        <input type="text" id="username" placeholder="Es: Comandante<script>" required>
    </div>
    <div>
        <label>Email</label>
        <input type="email" id="email" required>
    </div>
    <div>
        <label>Password (min 12 char)</label>
        <input type="password" id="password" required>
    </div>
    <div>
        <label>Regione</label>
        <select id="regione">
            <option value="Europa">Europa</option>
            <option value="America">America</option>
            <option value="Asia">Asia</option>
        </select>
    </div>
    <button type="submit">Registrati</button>
    <div id="response"></div>
</form>

<form id="loginForm">
    <h3>PWM Auth Test - Login</h3>
    <div>
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Es: Comandante" required>
    </div>
    <div>
        <label>Password (min 12 char)</label>
        <input type="password" id="login-password" required>
    </div>
    <button type="submit">Accedi</button>
    <div id="login-response"></div>
</form>

<script>
    // REGISTRAZIONE
    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const responseDiv = document.getElementById('response');
        
        const data = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            regione: document.getElementById('regione').value
        };

        try {
            const response = await fetch('http://localhost:3001/auth/test-auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            responseDiv.style.color = response.ok ? "#28a745" : "#dc3545";
            responseDiv.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
            responseDiv.style.color = "#dc3545";
            responseDiv.textContent = "Errore: Assicurati che il server Node.js sia attivo!";
        }
    });

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const responseDiv = document.getElementById('login-response');
        
        const data = {
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value
        };

        try {
            const response = await fetch('http://localhost:3001/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            responseDiv.style.color = response.ok ? "#28a745" : "#dc3545";
            responseDiv.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
            responseDiv.style.color = "#dc3545";
            responseDiv.textContent = "Errore: Assicurati che il server Node.js sia attivo!";
        }
    });
</script>

</body>
</html>
