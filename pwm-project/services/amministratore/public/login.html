<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login Amministratore</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; border-top: 5px solid #dc3545;}
        h2 { margin-bottom: 20px; color: #333; }
        input[type="password"] { padding: 12px; width: 90%; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
        button { padding: 12px; width: 100%; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
        button:hover { background: #0056b3; }
        #error { color: #dc3545; margin-top: 15px; display: none; font-weight: bold;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Accesso Amministratore</h2>
        <input type="password" id="password" placeholder="Inserisci la password segreta" onkeypress="if(event.key === 'Enter') login()"/>
        <br>
        <button onclick="login()">Accedi al Pannello</button>
        <p id="error">❌ Password Errata!</p>
    </div>

    <script>
        // Se c'è già un token valido, rimandi alla home (verrà validato dalle API)
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/';
        }

        async function login() {
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    const data = await res.json();
                    // Salviamo il token (che in questo caso è la flag stessa per semplicità)
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = '/'; // Vai alla dashboard
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch(e) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = '❌ Errore di rete al server!';
            }
        }
    </script>
</body>
</html>
