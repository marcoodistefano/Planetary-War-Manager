<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWM Tactical - Admin Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <div class="logo-area">
                <h1>PWM <span>TACTICAL</span></h1>
                <p class="subtitle">SISTEMA DI MONITORAGGIO ASLAN</p>
            </div>
            <div class="header-actions">
                <span id="active-count" class="status-badge">SCANSIONE...</span>
                <button class="btn btn-outline" onclick="logout()">LOGOUT</button>
            </div>
        </header>

        <section class="global-controls card">
            <h2>Comandi d'Emergenza</h2>
            <div class="btn-group">
                <button class="btn btn-yellow" onclick="riavviaTutti()">🔄 Riavvio Globale</button>
                <button class="btn btn-red" onclick="ripristinaDati()">🔥 Wipe & Restore</button>
                <button class="btn btn-blue" onclick="window.open('http://localhost:8085', '_blank')">Postgres</button>
                <button class="btn btn-blue" onclick="window.open('http://localhost:8086', '_blank')">Redis</button>
            </div>
        </section>

        <section class="topology-area card">
            <h2>Topologia di Rete (Weave Scope)</h2>
            <div class="iframe-wrapper">
                <iframe src="http://localhost:4040"></iframe>
            </div>
        </section>

        <h2 class="section-title" style="text-align: center; margin-bottom: 5px;">Deployment Status</h2>

        <div class="dashboard-legend">
            <div class="legend-item"><span class="dot cpu-dot"></span> CPU LOAD</div>
            <div class="legend-item"><span class="dot ram-dot"></span> RAM USAGE</div>
        </div>

        <div id="containers-grid" class="dashboard">
            </div>
            <!-- Dinamicamente popolato da script.js -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
