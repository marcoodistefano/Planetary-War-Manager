<ion-content [fullscreen]="true" class="transparent-bg" [scrollY]="false">
  
  <div class="hud-panel top-navbar">
    <div class="navbar-spacer"></div>
    <div class="resource-bar">
      <div *ngFor="let res of resourceConfig" 
           class="res-item" 
           [class.premium]="res.id === 'oro'" 
           [class.trigger-item]="res.isTrigger">
        
        <span class="res-icon">{{ res.icon }}</span>
        
        <div class="res-data">
          <span class="res-label">{{ res.label }}</span>
          <span class="res-val" *ngIf="!res.isTrigger">{{ playerResources[res.id] | number }}</span>
          <span class="res-val" *ngIf="res.isTrigger">STATUS</span>
        </div>

        <div class="troops-dropdown" *ngIf="res.isTrigger">
          <div class="dropdown-header">ARMATA ATTIVA</div>
          <div class="troop-entry" *ngFor="let troop of playerTroops | keyvalue">
            <span class="t-key">{{ troop.key }}:</span>
            <span class="t-val">{{ troop.value }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <div class="profile-icon" (click)="setOpenProfile(true)">👤</div>
    </div>
  </div>

  <div id="map-container"></div>

  <div class="hud-stack-left">
    
    <div class="hud-panel combined-control">
      <div class="hud-sub-section">
        <div class="title-block compact">
          <p class="eyebrow">Visual Engine</p>
          <h2>MAP SETTINGS</h2>
        </div>
        <select id="basemap-select" class="tactical-select" (change)="changeBasemap($event)">
          <option value="esri-sat">🛰️ ESRI Satellite</option>
          <option value="maptiler-hybrid">🌍 MapTiler Hybrid</option>
          <option value="carto-light">🛡️ Carto Stealth</option>
        </select>
        <div class="action-dock mini">
          <button class="ghost-button mini" (click)="toggleLayer('contours')">Contours</button>
          <button class="ghost-button mini" (click)="toggleLayer('bathymetry-layer')">Bathy</button>
        </div>
      </div>

      <div class="hud-separator"></div>

      <div class="hud-sub-section">
        <div class="title-block compact">
          <p class="eyebrow">Intelligence</p>
          <h2>SENSOR FEED</h2>
        </div>
        <div class="sensor-grid">
          <div class="sensor-row"><span>TER:</span><span class="sensor-val">{{ currentHoveredName || '--' }}</span></div>
          <div class="sensor-row"><span>POS:</span> <span id="out-coords" class="sensor-val">--</span></div>
          <div class="sensor-row"><span>ALT:</span> <span id="out-alt" class="sensor-val">--</span></div>
          <div class="sensor-row"><span>SUR:</span> <span id="out-type" class="sensor-val">--</span></div>
          <div class="sensor-row"><span>COM:</span> <span id="out-res-com" class="sensor-val" style="color: #a3e635;">--</span></div>
          <div class="sensor-row"><span>RAR:</span> <span id="out-res-rare" class="sensor-val" style="color: #c084fc;">--</span></div>
        </div>
      </div>
    </div>

    <div class="button-container">
      <button id="toggle-btn" class="primary-glow" (click)="switchGlobe()">SWITCH TO 3D GLOBE</button>
    </div>
  </div>

  <ion-modal [isOpen]="isProfileModalOpen" (didDismiss)="setOpenProfile(false)" class="tactical-modal">
  <ng-template>
    <app-tactical-terminal 
      [profile]="userProfile" 
      [audioSettings]="audioSettings" 
      [uiSettings]="uiSettings"
      (close)="setOpenProfile(false)">
    </app-tactical-terminal>
  </ng-template>
</ion-modal>
</ion-content>
