<ion-content [fullscreen]="true">
  <div class="auth-background" aria-hidden="true">
    <video #backgroundVideo class="auth-background__video" autoplay muted loop playsinline preload="metadata" src="assets/background_gif/background_gif.mp4"></video>
    <div class="auth-background__overlay"></div>
  </div>

  <div class="browser-container">
    
    <div class="header-nav">
      <ion-button fill="clear" routerLink="/home" class="back-link">
        [ <ion-icon name="chevron-back"></ion-icon> TORNA AL COMANDO ]
      </ion-button>
      <div class="title-block">
        <p class="eyebrow">Dossier Operativo</p>
        <h1>ARCHIVIO OPERAZIONI</h1>
      </div>
    </div>

    <div class="tabs-dock-center">
      <button [class.active]="view === 'active'" (click)="view = 'active'">OPERAZIONI ATTIVE</button>
      <button [class.active]="view === 'finished'" (click)="view = 'finished'">ARCHIVIO STORICO</button>
    </div>

    <div class="search-section">
      <ion-searchbar class="glass-searchbar" placeholder="Filtra per nome missione, creatore o settore..."></ion-searchbar>
    </div>

    <div class="results-container">
      <div class="scroll-area">
        <article class="mission-card-extended" *ngFor="let m of mockMatches">
          <div class="card-main-info">
            <div class="card-header">
              <span class="sector-tag">SETTORE_{{m.id}}</span>
              <span class="m-status" [class.done]="view === 'finished'">
                {{ view === 'active' ? '● OPERATIVA' : '■ TERMINATA' }}
              </span>
            </div>
            <h3>{{ m.name }}</h3>
            <p class="creator-info">Comandante Incaricato: <strong>{{ m.creator }}</strong></p>
          </div>

          <div class="card-stats-block">
            <div class="stat-unit">
              <span class="stat-label">REGIONE GIOCATA</span>
              <span class="stat-value">{{ m.region }}</span>
            </div>
            <div class="stat-unit">
              <span class="stat-label">ARROLATI</span>
              <span class="stat-value">{{ m.joined }}/{{ m.total }}</span>
            </div>
            <div class="stat-unit">
              <span class="stat-label">TEMPO TRASCORSO</span>
              <span class="stat-value">14H 20M</span>
            </div>
          </div>

          <div class="card-actions">
            <button class="action-btn-main">{{ view === 'active' ? 'ENTRA IN PARTITA' : 'REPLAY OPERAZIONE' }}</button>
          </div>
        </article>
      </div>
    </div>

  </div>
</ion-content>
