<ion-content class="transparent-content">
  <div class="modal-wrapper">
    <div class="glass-panel">
      
      <div class="header-section">
        <p class="eyebrow">Protocollo Sicurezza</p>
        <h2 class="neon-title">CRITTOGRAFIA ACCESSO</h2>
      </div>

      <div class="form-body">
        
        <div class="input-container">
          <label>PASSWORD ATTUALE</label>
          <div class="input-wrapper">
            <input type="password" [(ngModel)]="passData.old" placeholder="********" class="cyber-input" />
          </div>
        </div>

        <div class="input-container">
          <label>NUOVA IDENTITÀ CHIAVE</label>
          <div class="input-wrapper">
            <input type="password" [(ngModel)]="passData.new" placeholder="Minimo 12 caratteri" class="cyber-input" />
          </div>
        </div>

        <div class="input-container">
          <label>CONFERMA PROTOCOLLO</label>
          <div class="input-wrapper">
            <input type="password" [(ngModel)]="passData.confirm" placeholder="Ripeti chiave" class="cyber-input" />
          </div>
        </div>

      </div>

      <div class="footer-actions">
        <button class="action-btn primary-glow" (click)="save()" [disabled]="!passData.old || passData.new.length < 12 || passData.new !== passData.confirm">
          AGGIORNA CHIAVI
        </button>
        
        <button class="cancel-link" (click)="close()">
          [ INTERROMPI SEQUENZA ]
        </button>
      </div>

    </div>
  </div>
</ion-content>
