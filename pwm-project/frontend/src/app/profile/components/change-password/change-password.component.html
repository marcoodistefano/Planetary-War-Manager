<ion-content class="transparent-content">
  <div class="create-match-backdrop" (click)="close()">
    <div class="create-match-frame compact-frame" (click)="$event.stopPropagation()">
      <div class="create-match-sidebar compact-sidebar">
        <div class="brand">
          <span class="system-name">PROFILE EDITOR</span>
          <span class="version">OPS_CENTER V.4.0</span>
        </div>

        <nav>
          <div class="nav-item active">
            <ion-icon name="key-outline"></ion-icon><span>PASSWORD</span>
          </div>
        </nav>

        <div class="sidebar-footer">
          <button class="exit-btn" (click)="close()">
            <ion-icon name="close-outline" class="close-icon"></ion-icon>
            <span class="close-label">[ CHIUDI ]</span>
          </button>
        </div>
      </div>

      <div class="create-match-main scrollable-y compact-main">
        <div class="content-container compact-content">
          <div class="header-info">
            <p class="track-label">Protocollo Sicurezza</p>
          </div>

          <div class="sections-grid single-section">
            <div class="build-card no-hover">
              <div class="build-info">
                <span class="item-name">CRITTOGRAFIA ACCESSO</span>
                <span class="item-tier">CREDENZIALI</span>
              </div>

              <div class="form-body">
                <div class="setting-item">
                  <label>PASSWORD ATTUALE</label>
                  <input type="password" [(ngModel)]="passData.old" placeholder="********" class="tactical-input" />
                </div>

                <div class="setting-item">
                  <label>NUOVA PASSWORD</label>
                  <input type="password" [(ngModel)]="passData.new" placeholder="Minimo 12 caratteri" class="tactical-input" />
                </div>

                <div class="setting-item">
                  <label>CONFERMA PASSWORD</label>
                  <input type="password" [(ngModel)]="passData.confirm" placeholder="Ripeti chiave" class="tactical-input" />
                </div>
              </div>

              <div class="action-footer">
                <button class="primary-glow full-width" (click)="save()" [disabled]="!passData.old || passData.new.length < 12 || passData.new !== passData.confirm">
                  AGGIORNA CHIAVI
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
