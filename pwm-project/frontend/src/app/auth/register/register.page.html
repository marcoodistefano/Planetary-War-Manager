<ion-header [translucent]="true">
</ion-header>

<ion-content [fullscreen]="true">
  <div class="auth-background" aria-hidden="true">
    <video #backgroundVideo class="auth-background__video" autoplay muted loop playsinline preload="metadata" src="assets/background_gif/background_gif.mp4"></video>
    <div class="auth-background__overlay"></div>
  </div>

  <div class="register-container">
    <div class="logo-space">
      <!-- Qui potresti mettere il banner identificativo citato nel CDD -->
      <h1>PLANETARY WAR MANAGER</h1>
    </div>

    <form [formGroup]="RegisterForm" (ngSubmit)="onSubmit()">
  
      <!-- USERNAME -->
      <div class="field-container">
        <ion-label class="custom-label">USERNAME</ion-label>
        <ion-input type="text" formControlName="username" placeholder="nome utente"></ion-input>
      </div>

      <!-- REGIONE UTENTE -->
      <div class="field-container">
        <ion-label class="custom-label">REGIONE UTENTE</ion-label>
        <ion-select formControlName="region" interface="popover" placeholder="Seleziona Regione">
          <ion-select-option *ngFor="let country of countries" [value]="country.code">
            {{ country.flag }} {{ country.name }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- EMAIL -->
      <div class="field-container">
        <ion-label class="custom-label">EMAIL COMANDANTE</ion-label>
        <ion-input type="email" formControlName="email" placeholder="nome@esempio.it"></ion-input>
      </div>

      <!-- PASSWORD -->
      <div class="field-container">
        <ion-label class="custom-label">PASSWORD</ion-label>
        <ion-input type="password" formControlName="password" placeholder="••••••••"></ion-input>
      </div>

      <ion-button expand="block" type="submit" [disabled]="!RegisterForm.valid || isSubmitting">
        REGISTRAZIONE
      </ion-button>

      <ion-text class="form-error" color="danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </ion-text>

      <div class="form-footer">
        <p>Hai giá un account? <a class="secondary-link" routerLink="/login">Accedi ora</a></p>
      </div>
    </form>
  </div>


</ion-content>
<ion-footer class="ion-no-border">
  <div class="hud-footer transparent-element" style="border-top: 1px solid rgba(88, 166, 255, 0.2);">
    <div class="hud-footer-content">
      <div class="footer-left">
        <span class="status-dot"></span> COMM-LINK: <span class="status-text">ONLINE</span>
      </div>
      <div class="footer-center">
        &copy; 2026 PLANETARY WAR MANAGER <span class="divider">///</span> STRATEGIC COMMAND
      </div>
      <div class="footer-right">
        SYS.VER 1.0.4
      </div>
    </div>
  </div>
</ion-footer>
