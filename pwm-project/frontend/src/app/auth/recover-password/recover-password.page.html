<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="auth-background" aria-hidden="true">
    <video #backgroundVideo class="auth-background__video" autoplay muted loop playsinline preload="metadata" src="assets/background_gif/background_gif.mp4"></video>
    <div class="auth-background__overlay"></div>
  </div>

  <div class="title-block">
    <p class="eyebrow">Strategia, alleanze, conquista</p>
    <h1>Planetary War<br>Manager</h1>
  </div>

  <div class="login-container">
    <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
      <div class="field-container">
        <ion-label class="custom-label">EMAIL COMANDANTE</ion-label>
        <ion-input type="email" formControlName="email" placeholder="nome@esempio.it"></ion-input>
      </div>

      <ion-button expand="block" type="submit" [disabled]="!recoverForm.valid || isSubmitting">INVIA LINK DI RECUPERO</ion-button>
      <ion-text class="form-error" color="danger" *ngIf="errorMessage">{{ errorMessage }}</ion-text>
      <ion-text class="form-success" color="success" *ngIf="successMessage">{{ successMessage }}</ion-text>

      <div class="form-footer">
        <a class="secondary-link" routerLink="/login">Torna al login</a>
        <p>Non hai un account? <a class="secondary-link" routerLink="/register">Registrati ora</a></p>
      </div>
    </form>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="hud-footer">
    <div class="hud-footer-content">
      <div class="footer-left">
        <span class="status-dot"></span> COMM-LINK: <span class="status-online">ONLINE</span>
      </div>
      <div class="footer-center">&copy; 2026 PLANETARY WAR MANAGER <span class="divider">///</span> STRATEGIC COMMAND</div>
      <div class="footer-right">SYS.VER 1.0.4</div>
    </div>
  </div>
</ion-footer>
