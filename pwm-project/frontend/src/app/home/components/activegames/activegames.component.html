<ion-content class="transparent-bg">
  <div class="modal-wrapper">
    <div class="panel">
      
      <div class="title-block">
        <p class="eyebrow">Rapporto Operativo</p>
        <h2>PARTITE ATTIVE</h2>
      </div>

      <div class="games-scroll-container">
        <div class="games-list">
          
          <div class="game-card" *ngFor="let game of activeGames">
            <div class="game-info">
              <h3>{{ game.name }}</h3>
              <div class="meta">{{ game.creatorDisplayName || game.creator }} · {{ game.timeCreatedFormatted || activeGameTimeText(game) }}</div>
            </div>
            <div class="badge-row">
              <span class="region-badge" *ngIf="game.regionPlayable">{{ game.regionPlayable }}</span>
              <span class="players-badge">{{ game.playersLabel || game.players }}</span>
              <span class="status-badge">{{ game.status }}</span>
            </div>
          </div>

          <div *ngIf="activeGames.length === 0" class="no-results">
            [ NESSUNA PARTITA IN CORSO ]
          </div>

        </div>
      </div>

      <div class="action-dock">
        <button class="logout-button" (click)="close()">
          [ CHIUDI TERMINALE ]
        </button>
      </div>

    </div>
  </div>
</ion-content>
