<ion-content class="transparent-bg">
  <div class="modal-wrapper">
    <div class="panel">
      
      <div class="title-block">
        <p class="eyebrow">Intel Network</p>
        <h2>NUOVI CONFLITTI</h2>
      </div>

      <div class="search-container">
        <input 
          type="text" 
          class="tactical-input" 
          placeholder="Cerca missione o creatore..." 
          (input)="filter($event)">
      </div>

      <div class="games-scroll-container">
        <div class="games-list">
          
          <div class="game-card" *ngFor="let game of filteredGames">
            <div class="game-info">
              <h3>{{ game.name }}</h3>
              <div class="meta">{{ game.players }} GIOCATORI · CREATA DA {{ game.creator | uppercase }}</div>
            </div>
            <button class="join-button">PARTECIPA</button>
          </div>
          
          <div *ngIf="filteredGames.length === 0" class="no-results">
            [ NESSUN CONFLITTO TROVATO ]
          </div>

        </div>
      </div>

      <div class="action-dock">
        <button class="logout-button" (click)="close()">
          [ CHIUDI TERMINALE ]
        </button>
      </div>

    </div>
  </div>
</ion-content>
