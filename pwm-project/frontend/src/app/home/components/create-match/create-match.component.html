<ion-content [scrollY]="false" class="transparent-bg">
  <div class="modal-wrapper">
    <div class="panel extra-wide-panel">
      
      <div class="title-block">
        <h2>CREA NUOVA PARTITA</h2>
      </div>

      <div class="settings-scroll-container">
        <div class="sections-grid">
          
          <div class="inner-panel">
            <p class="custom-label">SETTORE 01: GEOGRAFIA</p>
            <div class="setting-item">
              <label>IDENTIFICATIVO MISSIONE</label>
              <input type="text" class="tactical-input" [(ngModel)]="matchData.missione" placeholder="Operazione...">
            </div>
            <div class="setting-item">
              <label>REGIONE OPERATIVA</label>
              <select class="tactical-select" [(ngModel)]="matchData.regione">
                <option *ngFor="let r of regioni" [value]="r">{{ r }}</option>
              </select>
            </div>
            <div class="setting-item">
              <label>SCALA SETTORE (MAP_SIZE)</label>
              <select class="tactical-select" [(ngModel)]="matchData.mapSize">
                <option>Small</option>
                <option>Medium</option>
                <option>Large</option>
                <option>XLarge</option>
                <option>Huge</option>
              </select>
            </div>
            <div class="setting-item">
              <label>CAPACITÀ COMANDANTI</label>
              <select class="tactical-select">
                <option *ngFor="let p of maxPlayers" [value]="p">{{ p }} Partecipanti</option>
              </select>
            </div>
          </div>

          <div class="inner-panel">
            <p class="custom-label">SETTORE 02: OBIETTIVI</p>
            <div class="setting-item">
              <label>MODALITÀ DI GIOCO</label>
              <select class="tactical-select" [(ngModel)]="matchData.modalita">
                <option *ngFor="let mod of modalitaGioco" [value]="mod">{{ mod }}</option>
              </select>
            </div>
            <div class="setting-item">
              <label>SOGLIA VITTORIA (%)</label>
              <ion-range min="10" max="100" step="5" snaps="true" pin="true" color="primary" class="tactical-range"></ion-range>
            </div>
            <div class="setting-item toggle-group">
              <label>GIOCO A SQUADRE (SQUAD)</label>
              <ion-toggle class="tactical-toggle" [(ngModel)]="matchData.isSquad"></ion-toggle>
            </div>
            <ion-range [(ngModel)]="matchData.vittoriaSoglia" min="10" max="100" step="5" snaps="true" pin="true" color="primary" class="tactical-range"></ion-range>
            <div class="setting-item toggle-group">
              <label>PARTITA CLASSIFICATA (ELO)</label>
              <ion-toggle [(ngModel)]="matchData.hasElo" class="tactical-toggle" color="primary"></ion-toggle>
            </div>
            <div class="setting-item toggle-group">
              <label>ALLEANZE CONSENTITE</label>
              <ion-toggle [(ngModel)]="matchData.alleanze" class="tactical-toggle" color="primary"></ion-toggle>
            </div>
          </div>

          <div class="inner-panel">
            <p class="custom-label">SETTORE 03: CRONOLOGIA</p>
            <div class="setting-item">
              <label>DURATA MASSIMA OPERAZIONE</label>
              <select class="tactical-select">
                <option *ngFor="let d of durataMax" [value]="d">{{ d }}</option>
              </select>
            </div>
            <div class="setting-item">
              <label>MOLTIPLICATORE TEMPORALE</label>
              <select class="tactical-select">
                <option *ngFor="let m of moltiplicatori" [value]="m">{{ m }}</option>
              </select>
            </div>
            <div class="setting-item">
              <label>PROGRAMMAZIONE AVVIO</label>
              <select class="tactical-select">
                <option>Immediato</option>
                <option>Tra 1 Ora</option>
                <option>Tra 6 Ore</option>
                <option>Tra 12 Ore</option>
                <option>Tra 24 Ore</option>
              </select>
            </div>
            <div class="setting-item">
              <label>QUORUM MINIMO AVVIO</label>
              <input type="number" class="tactical-input" value="2" min="2">
            </div>
          </div>

        </div>
      </div>

      <div class="action-dock">
        <button class="primary-glow" (click)="confirmCreation()">TRASMETTI ORDINI DI BATTAGLIA</button>
        <button class="logout-button" (click)="close()">[ CHIUDI TERMINALE ]</button>
      </div>

    </div>
  </div>
</ion-content>
