<ion-content [scrollY]="false" class="transparent-bg">
  <div class="modal-wrapper">
    <div class="panel">
      
      <div class="title-block">
        <p class="eyebrow">Direttive Comando Supremo</p>
        <h2>OBIETTIVI TATTICI</h2>
      </div>

      <div class="objectives-list">
        <div class="objective-card" *ngFor="let obj of objectives" [class.completed]="obj.progress === 100">
          <div class="obj-header">
            <div class="obj-title-wrap">
              <ion-icon [name]="obj.icon"></ion-icon>
              <span>{{ obj.title }}</span>
            </div>
            <span class="obj-reward">{{ obj.reward }}</span>
          </div>
          <div class="obj-body">
            <p>{{ obj.desc }}</p>
            <div class="progress-container">
              <div class="progress-bar"><div class="progress-fill" [style.width.%]="obj.progress"></div></div>
              <span class="percentage">{{ obj.progress }}%</span>
            </div>
          </div>
          <div class="completed-badge" *ngIf="obj.progress === 100">COMPLETATO</div>
        </div>
      </div>

      <div class="action-dock">
        <button class="logout-button" (click)="close()">
          [ CHIUDI DOSSIER ]
        </button>
      </div>

    </div>
  </div>
</ion-content>
