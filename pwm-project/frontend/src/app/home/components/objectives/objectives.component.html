<div class="create-match-backdrop" (click)="close()">
  <div class="create-match-frame" (click)="$event.stopPropagation()">
    <div class="create-match-sidebar">
      <div class="brand">
        <span class="system-name">OBIETTIVI TATTICI</span>
        <span class="version">OPS_CENTER V.4.0</span>
      </div>

      <nav>
        <div class="nav-item active">
          <ion-icon name="flag-outline"></ion-icon><span>MISSIONI</span>
        </div>
        <div class="nav-item disabled">
          <ion-icon name="shield-outline"></ion-icon><span>PROGRESSO</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="exit-btn" (click)="close()">
          <ion-icon name="power-outline" class="close-icon"></ion-icon>
          <span class="close-label">[ CHIUDI ]</span>
        </button>
      </div>
    </div>

    <div class="create-match-main scrollable-y">
      <div class="title-block">
        <p class="eyebrow">Direttive Comando Supremo</p>
        <h2>OBIETTIVI TATTICI</h2>
      </div>

      <div class="objectives-list">
        <div class="objective-card" *ngFor="let obj of objectives" [class.completed]="obj.progress === 100">
          <div class="obj-header">
            <div class="obj-title-wrap">
              <ion-icon [name]="obj.icon"></ion-icon>
              <span>{{ obj.title }}</span>
            </div>
            <span class="obj-reward">{{ obj.reward }}</span>
          </div>
          <div class="obj-body">
            <p>{{ obj.desc }}</p>
            <div class="progress-container">
              <div class="progress-bar"><div class="progress-fill" [style.width.%]="obj.progress"></div></div>
              <span class="percentage">{{ obj.progress }}%</span>
            </div>
          </div>
          <div class="completed-badge" *ngIf="obj.progress === 100">COMPLETATO</div>
        </div>
      </div>
    </div>

  </div>
</div>
