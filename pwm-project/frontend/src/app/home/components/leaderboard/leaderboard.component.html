<div class="create-match-backdrop" (click)="close()">
  <div class="create-match-frame" (click)="$event.stopPropagation()">
    <div class="create-match-sidebar">
      <div class="brand">
        <span class="system-name">LEADERBOARD</span>
        <span class="version">OPS_CENTER V.4.0</span>
      </div>

      <nav>
        <div class="nav-item active">
          <ion-icon name="trophy-outline"></ion-icon><span>CLASSIFICHE</span>
        </div>
        <div class="nav-item disabled">
          <ion-icon name="globe-outline"></ion-icon><span>DATI</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="exit-btn" (click)="close()">
          <ion-icon name="power-outline"></ion-icon> <span>[ CHIUDI ]</span>
        </button>
      </div>
    </div>

    <div class="create-match-main scrollable-y">
      <div class="title-block">
        <p class="eyebrow">Classifiche Settore</p>
        <h2>LEADERBOARD</h2>
      </div>

      <div class="leaderboard-toggle">
        <button [class.active]="currentView === 'global'" (click)="switchView('global')">GLOBALE</button>
        <button [class.active]="currentView === 'regional'" (click)="switchView('regional')">{{ dynamicRegionalLabel }}</button>
      </div>

      <div class="leaderboard-scroll-container">
        <div class="leaderboard-list">
          <div class="leaderboard-entry" *ngFor="let player of leaderboard" [class.highlight]="player.player === loggedInPlayer">
            <span class="rank">#{{ player.rank }}</span>
            <span class="flag">{{ flagEmoji(player.region) }}</span>
            <span class="name">{{ player.player }}</span>
            <span class="score">{{ player.score | number }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
